name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.11"
      - name: Set up Python
        run: uv python install 3.12
      - name: Ruff lint
        run: uvx ruff@0.6.9 check .
      - name: Ruff format check
        run: uvx ruff@0.6.9 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.11"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies (dev)
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.11"
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  wheel-install:
    # The built wheel must work from a clean environment: the CLI runs, the
    # bundled DEIS snapshot resolves, and the offline demo produces its files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.11"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build wheel
        run: uv build --wheel
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/env --python 3.12
          uv pip install --python /tmp/env dist/*.whl
      - name: CLI runs from the installed wheel
        run: |
          /tmp/env/bin/urg-forecast --version
          cd /tmp && /tmp/env/bin/urg-forecast demo --offline -H 4 -o /tmp/out
          test -f /tmp/out/24-105_hospital-de-puerto-montt/pronostico.png
