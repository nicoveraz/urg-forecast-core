name: datos

# Once a week: download DEIS once, build the mirror of daily totals that
# `urg-forecast` reads by default, precompute the demo forecasts, and publish
# everything to the orphan branch `datos` (force-pushed: one commit, no history,
# so the repository does not grow). Then rebuild the documentation site.
on:
  schedule:
    - cron: "17 9 * * 2" # Tuesdays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.11"
      - run: uv python install 3.12
      - run: uv sync --python 3.12

      - name: Restore DEIS downloads
        uses: actions/cache@v4
        with:
          path: data/external/deis_cache
          key: deis-${{ github.run_id }}
          restore-keys: deis-

      - name: Drop the years DEIS is still updating
        run: |
          y=$(date -u +%Y)
          rm -f data/external/deis_cache/AtencionesUrgencia${y}.zip
          rm -f data/external/deis_cache/AtencionesUrgencia$((y-1)).zip

      - name: Build the mirror (one DEIS download per year)
        run: uv run python scripts/construir_datos.py espejo salida

      - name: Precompute demo forecasts
        run: uv run python scripts/construir_datos.py demo salida --workers 4

      - name: Publish to the datos branch
        run: |
          cp scripts/LEEME_datos.md salida/README.md
          cd salida
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "datos: $(jq -r .ultima_fecha meta.json) ($(date -u +%F))"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" datos
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rebuild the site with the new demo data
        run: gh workflow run docs.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
