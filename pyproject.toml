[project]
name = "urg-forecast-core"
version = "0.3.0"
description = "Base abierta para pronosticar la demanda de urgencias en Chile con datos públicos del DEIS MINSAL: una aproximación inicial para ajustar y extender."
readme = "README.md"
license = { file = "LICENSE" }
# Upper bound tracks statsforecast/numba, which do not yet publish wheels for 3.13.
requires-python = ">=3.11,<3.13"
authors = [{ name = "Nicolás Vera Z." }]
keywords = [
    "emergency-department",
    "forecasting",
    "time-series",
    "healthcare",
    "chile",
    "deis",
    "minsal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "holidays>=0.50",
    "statsforecast>=1.7",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/nicoveraz/urg-forecast-core"
Repository = "https://github.com/nicoveraz/urg-forecast-core"
Issues = "https://github.com/nicoveraz/urg-forecast-core/issues"
Documentation = "https://nicoveraz.github.io/urg-forecast-core/"
Changelog = "https://github.com/nicoveraz/urg-forecast-core/blob/main/CHANGELOG.md"

[project.scripts]
urg-forecast = "urgencias_core.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.6.9", # pinned to match pre-commit and CI so format style can't drift
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Ensure the bundled demo fixture ships in the wheel even though *.parquet is
# git-ignored by default.
artifacts = ["src/urgencias_core/data/_fixtures/*.parquet"]

[tool.hatch.build.targets.wheel]
packages = ["src/urgencias_core"]

[tool.hatch.build.targets.sdist]
# Ship source, tests, and docs prose; drop CI config, dev tooling, rendered
# images, and build byproducts that bloat the sdist.
exclude = [
    "/.github",
    "/.pre-commit-config.yaml",
    "/.python-version",
    "/.pytest_cache",
    "/.zenodo.json",
    "/docs/img",
    "/experiments",
    "/outputs",
    "/urg-forecast-salida",
    "/sitio",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only silence third-party deprecations we can't act on (statsforecast/numba
# pull these in); keep our own deprecations visible rather than a blanket ignore.
filterwarnings = [
    "default::DeprecationWarning",
    "ignore::DeprecationWarning:statsforecast.*",
    "ignore::DeprecationWarning:numba.*",
    "ignore::DeprecationWarning:pandas.*",
]
