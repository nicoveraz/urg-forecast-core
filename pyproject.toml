[project]
name = "urgencias-core"
version = "0.0.0"
description = "Reference code for Chilean ED analytics, simulation, and forecasting. Open foundation of Eunosia."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Nicolás Vera Z." }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "holidays>=0.50",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Forecasting models beyond the SeasonalNaive baseline. scikit-learn is
# required at runtime by LightGBM's sklearn API (LGBMRegressor).
models = [
    "lightgbm>=4.3",
    "statsforecast>=1.7",
    "scikit-learn>=1.4",
]
# matplotlib/base64 PNG charts and markdown tables used by the demos, reports,
# and the reference server.
viz = [
    "matplotlib>=3.8",
    "tabulate>=0.9",
]
# The minimal FastAPI reference server (renders charts, so it pulls in viz).
server = [
    "urgencias-core[viz]",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]
# Network fetchers: DEIS MINSAL open data and the Open-Meteo weather client.
fetch = [
    "httpx>=0.27",
]
# Everything, for running the demos and the full test suite.
all = [
    "urgencias-core[models,viz,server,fetch]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Ensure the bundled demo fixture ships in the wheel even though *.parquet is
# git-ignored by default.
artifacts = ["src/urgencias_core/data/_fixtures/*.parquet"]

[tool.hatch.build.targets.wheel]
packages = ["src/urgencias_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
