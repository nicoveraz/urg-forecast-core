[project]
name = "urg-forecast-core"
version = "0.1.0"
description = "Reference code for Chilean ED analytics, simulation, and forecasting. Open foundation of Eunosia."
readme = "README.md"
license = { file = "LICENSE" }
# Upper bound tracks the optional forecasting stack (numba/statsforecast),
# which does not yet publish wheels for 3.13; revisit once it does.
requires-python = ">=3.11,<3.13"
authors = [{ name = "Nicolás Vera Z." }]
keywords = [
    "emergency-department",
    "forecasting",
    "monte-carlo",
    "simulation",
    "time-series",
    "healthcare",
    "chile",
    "deis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "holidays>=0.50",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Forecasting models beyond the SeasonalNaive baseline. scikit-learn is
# required at runtime by LightGBM's sklearn API (LGBMRegressor).
models = [
    "lightgbm>=4.3",
    "statsforecast>=1.7",
    "scikit-learn>=1.4",
]
# matplotlib/base64 PNG charts and markdown tables used by the demos, reports,
# and the reference server.
viz = [
    "matplotlib>=3.8",
    "tabulate>=0.9",
]
# The minimal FastAPI reference server (renders charts, so it pulls in viz).
server = [
    "urg-forecast-core[viz]",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]
# Network fetchers: DEIS MINSAL open data and the Open-Meteo weather client.
fetch = [
    "httpx>=0.27",
]
# Everything, for running the demos and the full test suite.
all = [
    "urg-forecast-core[models,viz,server,fetch]",
]

[project.urls]
Homepage = "https://github.com/nicoveraz/urg-forecast-core"
Repository = "https://github.com/nicoveraz/urg-forecast-core"
Issues = "https://github.com/nicoveraz/urg-forecast-core/issues"

[project.scripts]
urgencias-demo-synthetic = "urgencias_core.demos.synthetic:main"
urgencias-demo-deis = "urgencias_core.demos.deis:main"
urgencias-server = "urgencias_core.demos.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.6.9", # pinned to match pre-commit and CI so format style can't drift
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Ensure the bundled demo fixture ships in the wheel even though *.parquet is
# git-ignored by default.
artifacts = ["src/urgencias_core/data/_fixtures/*.parquet"]

[tool.hatch.build.targets.wheel]
packages = ["src/urgencias_core"]

[tool.hatch.build.targets.sdist]
# Ship source, tests, and docs prose; drop CI config, dev tooling, rendered
# images, and build byproducts that bloat the sdist.
exclude = [
    "/.github",
    "/.pre-commit-config.yaml",
    "/.python-version",
    "/.pytest_cache",
    "/.zenodo.json",
    "/docs/img",
    "/outputs",
    "/paper",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only silence third-party deprecations we can't act on (statsforecast/numba
# pull these in); keep our own deprecations visible rather than a blanket ignore.
filterwarnings = [
    "default::DeprecationWarning",
    "ignore::DeprecationWarning:statsforecast.*",
    "ignore::DeprecationWarning:numba.*",
    "ignore::DeprecationWarning:pandas.*",
]
