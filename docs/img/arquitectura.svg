<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 712" width="560" height="712" role="img" aria-labelledby="t d">
  <title id="t">Cómo fluyen los datos en urg-forecast-core</title>
  <desc id="d">Los datos del DEIS se convierten en una serie semanal. Esa serie alimenta el análisis descriptivo y los modelos; los modelos pueden sumar una tabla de variables externas, usando solo lo ya publicado. Los modelos se evalúan con el backtest, el mejor se usa para pronosticar, y el análisis y el pronóstico terminan en informes, comandos y la demo.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa1ab; stroke-width: 1.4; }
    .data { fill: #eef7f5; stroke: #3f8f80; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .title { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1b1f24; }
    .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f766e; }
    .small { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b5360; }
    .arrow { stroke: #6b7380; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .head { fill: #6b7380; }
    .label { font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b7380; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17181c; }
      .box { fill: #23252b; stroke: #6b7280; }
      .data { fill: #15302c; stroke: #5eb8a7; }
      .title { fill: #f1f3f5; }
      .mono { fill: #5eead4; }
      .small { fill: #b4bac3; }
      .arrow { stroke: #9aa1ab; }
      .head { fill: #9aa1ab; }
      .label { fill: #9aa1ab; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="560" height="712" rx="14"/>

  <!-- arrows first, boxes on top -->
  <path class="arrow" d="M141,94 V124"/>
  <path class="arrow" d="M419,94 V124"/>
  <path class="arrow" d="M141,190 V228"/>
  <path class="arrow" d="M220,190 V209 H389 V228"/>
  <path class="arrow" d="M449,190 V228"/>
  <text class="label" x="457" y="214">solo lo publicado</text>
  <path class="arrow" d="M419,318 V348"/>
  <path class="arrow" d="M419,426 V456"/>
  <path class="arrow" d="M419,534 V572"/>
  <path class="arrow" d="M141,318 V572"/>

  <!-- row 1: sources -->
  <rect class="box" x="16" y="16" width="250" height="78" rx="10"/>
  <text class="title" x="30" y="40">Datos del DEIS</text>
  <text class="mono" x="30" y="60">data/</text>
  <text class="small" x="30" y="80">copia semanal o snapshot incluido</text>

  <rect class="box" x="294" y="16" width="250" height="78" rx="10"/>
  <text class="title" x="308" y="40">Variables externas</text>
  <text class="mono" x="308" y="60">regressors.py</text>
  <text class="small" x="308" y="80">feriados, virus o una propia</text>

  <!-- row 2: data shapes -->
  <rect class="data" x="16" y="126" width="250" height="64" rx="10"/>
  <text class="title" x="30" y="151">Serie semanal</text>
  <text class="mono" x="30" y="173">timestamp, count</text>

  <rect class="data" x="294" y="126" width="250" height="64" rx="10"/>
  <text class="title" x="308" y="151">Tabla de regresores</text>
  <text class="mono" x="308" y="173">timestamp, columnas</text>

  <!-- row 3 -->
  <rect class="box" x="16" y="230" width="250" height="88" rx="10"/>
  <text class="title" x="30" y="254">¿Cómo ha sido la demanda?</text>
  <text class="mono" x="30" y="275">analysis/</text>
  <text class="small" x="30" y="296">año típico, nivel, interanual</text>

  <rect class="box" x="294" y="230" width="250" height="88" rx="10"/>
  <text class="title" x="308" y="254">¿Cómo se proyecta?</text>
  <text class="mono" x="308" y="275">models/</text>
  <text class="small" x="308" y="296">cada modelo: fit y predict;</text>
  <text class="small" x="308" y="311">se piden por nombre</text>

  <!-- row 4 -->
  <rect class="box" x="294" y="350" width="250" height="76" rx="10"/>
  <text class="title" x="308" y="374">¿Qué tan bien funciona?</text>
  <text class="mono" x="308" y="394">eval/</text>
  <text class="small" x="308" y="414">backtest y compare_models</text>

  <!-- row 5 -->
  <rect class="box" x="294" y="458" width="250" height="76" rx="10"/>
  <text class="title" x="308" y="482">Elegir y pronosticar</text>
  <text class="mono" x="308" y="502">forecast.py</text>
  <text class="small" x="308" y="522">el de menor pérdida P80</text>

  <!-- row 6: outputs -->
  <rect class="box" x="16" y="574" width="528" height="80" rx="10"/>
  <text class="title" x="30" y="598">Resultados</text>
  <text class="mono" x="30" y="619">report.py · cli.py · demo</text>
  <text class="small" x="30" y="640">tablas, CSV, figuras y los comandos analizar, pronosticar y comparar</text>

  <!-- legend -->
  <rect class="data" x="16" y="676" width="28" height="18" rx="4"/>
  <text class="small" x="52" y="690">datos (un DataFrame)</text>
  <rect class="box" x="210" y="676" width="28" height="18" rx="4"/>
  <text class="small" x="246" y="690">código (un módulo del paquete)</text>
</svg>
